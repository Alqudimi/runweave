[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runweave"
version = "0.1.0"
description = "Safe, resumable runbooks for the commands you already trust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abdulaziz Alqudimi" }]
keywords = ["workflow", "runbook", "recovery", "cli", "reproducibility", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
runweave = "runweave.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests that exercise filesystem, subprocess, or SQLite adapters",
  "e2e: end-to-end CLI tests",
]
